<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.05)}.l{font:600 12px/1.4 var(--font-sans);color:var(--track-dark);margin-top:6px}.m{font:500 11px/1.4 var(--font-latin);color:var(--track-gray)}</style></head><body><div class="row" style="background:var(--surface-page);padding:20px;margin:-20px;gap:20px"><div style="flex:1;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-xs);display:flex;align-items:center;justify-content:center" class="m">--shadow-xs</div><div style="flex:1;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center" class="m">--shadow-card</div><div style="flex:1;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-raised);display:flex;align-items:center;justify-content:center" class="m">--shadow-raised</div><div style="flex:1;height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-overlay);display:flex;align-items:center;justify-content:center" class="m">--shadow-overlay</div></div></body></html>
