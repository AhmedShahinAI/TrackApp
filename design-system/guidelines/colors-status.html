<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:#fff}.row{display:flex;gap:12px;flex-wrap:wrap}.sw{flex:1;min-width:80px}.chip{height:64px;border-radius:10px;border:1px solid rgba(0,0,0,.05)}.l{font:600 12px/1.4 var(--font-sans);color:var(--track-dark);margin-top:6px}.m{font:500 11px/1.4 var(--font-latin);color:var(--track-gray)}</style></head><body><div class="row" style="gap:20px"><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-active-fg);background:var(--status-active-bg)">فعّال</span><div class="m" style="margin-top:6px">active</div></div><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-success-fg);background:var(--status-success-bg)">مكتمل</span><div class="m" style="margin-top:6px">success</div></div><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-progress-fg);background:var(--status-progress-bg)">قيد التنفيذ</span><div class="m" style="margin-top:6px">progress</div></div><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-danger-fg);background:var(--status-danger-bg)">متأخرة</span><div class="m" style="margin-top:6px">danger</div></div><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-warning-fg);background:var(--status-warning-bg)">بانتظار الاعتماد</span><div class="m" style="margin-top:6px">warning</div></div><div><span style="display:inline-flex;align-items:center;height:24px;padding:0 12px;border-radius:6px;font:600 12px var(--font-sans);color:var(--status-neutral-fg);background:var(--status-neutral-bg)">لم تبدأ</span><div class="m" style="margin-top:6px">neutral</div></div></div></body></html>
