<!-- @dsCard group="Mobile App" viewport="900x900" name="TRACK mobile" subtitle="Instructor login and my-sections view" -->
<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRACK Mobile</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:#E6EDF0;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:40px;padding:30px;box-sizing:border-box;flex-wrap:wrap}*{box-sizing:border-box}</style>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../web-app/data.js"></script>
</head><body><div id="root" style="display:contents"></div>
<script type="text/babel">
function Phone({children}){
  return <div style={{width:390,height:844,borderRadius:48,background:'#0B1F26',padding:12,boxShadow:'var(--shadow-overlay)'}}>
    <div style={{position:'relative',width:'100%',height:'100%',borderRadius:38,overflow:'hidden',background:'var(--surface-page)',display:'flex',flexDirection:'column'}}>
      <div dir="ltr" style={{height:44,flex:'none',display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 28px',font:'600 14px var(--font-latin)'}}><span>9:41</span><span style={{width:110,height:30,borderRadius:20,background:'#0B1F26'}}></span><span>100%</span></div>
      {children}
    </div>
  </div>;
}
function MobileLogin({onLogin}){
  const {Logo,Input,Button,Checkbox}=window.DS;
  return <div style={{flex:1,display:'flex',flexDirection:'column',padding:'40px 24px',background:'#fff'}}>
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8,marginBottom:40}}>
      <Logo height={44} assetBase="../../assets/"/>
      <div style={{font:'500 13px var(--font-sans)',color:'var(--text-secondary)'}}>منصة إدارة ومتابعة المبادرات الأكاديمية</div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <Input icon="user" placeholder="الرقم الجامعي / البريد الإلكتروني" size="lg"/>
      <Input icon="lock" type="password" placeholder="كلمة المرور" size="lg"/>
      <Checkbox label="تذكرني"/>
      <Button size="lg" fullWidth onClick={onLogin}>تسجيل الدخول</Button>
      <a href="#" style={{textAlign:'center',font:'500 13px var(--font-sans)'}}>نسيت كلمة المرور؟</a>
    </div>
    <div style={{flex:1}}></div>
    <img src="../../assets/graphic-stripes.png" style={{width:'calc(100% + 48px)',margin:'0 -24px -40px',display:'block'}}/>
  </div>;
}
function MobileHome({onOpen}){
  const {StatusBadge,ProgressBar,Icon,IconButton}=window.DS;
  const D=window.TRACK_DATA;
  const mine=D.sections.slice(0,4);
  return <div style={{flex:1,display:'flex',flexDirection:'column',minHeight:0}}>
    <div style={{background:'var(--surface-sidebar)',color:'#fff',padding:'16px 20px 22px'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div><div style={{font:'500 13px var(--font-sans)',opacity:.75}}>مرحبًا</div><div style={{font:'700 18px var(--font-sans)'}}>أ. محمد الحربي</div></div>
        <span style={{width:40,height:40,borderRadius:12,background:'rgba(255,255,255,.12)',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="bell" size={20}/></span>
      </div>
      <div style={{display:'flex',gap:10,marginTop:18}}>{[['4','شعبي'],['142','الطلبة'],['61%','الإنجاز']].map(([v,l])=><div key={l} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:12,padding:'10px 12px'}}><div style={{font:'700 20px var(--font-numeric)',color:'var(--track-mint)'}}>{v}</div><div style={{font:'500 12px var(--font-sans)',opacity:.8}}>{l}</div></div>)}</div>
    </div>
    <div style={{flex:1,overflow:'auto',padding:'18px 16px',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{font:'700 15px var(--font-sans)'}}>شعبي في مبادرة مهارات المستقبل</div>
      {mine.map(s=><button key={s.id} onClick={onOpen} style={{textAlign:'start',border:'1px solid var(--border-default)',background:'#fff',borderRadius:12,padding:14,boxShadow:'var(--shadow-card)',cursor:'pointer',display:'flex',flexDirection:'column',gap:10,font:'inherit'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}><div style={{font:'700 15px var(--font-sans)'}}>الشعبة {s.no} · {s.course}</div><StatusBadge status={s.status}/></div>
        <div style={{font:'400 12px var(--font-sans)',color:'var(--text-secondary)'}}>{s.courseName} · {s.students} طالب · فرع {D.branchName(s.branch)}</div>
        <ProgressBar value={s.completion}/>
      </button>)}
    </div>
    <div style={{height:64,flex:'none',display:'flex',justifyContent:'space-around',alignItems:'center',background:'#fff',borderTop:'1px solid var(--border-default)'}}>
      {[['house','الرئيسية',1],['users','الشعب'],['graduation-cap','الطلبة'],['settings','الإعدادات']].map(([i,l,on])=><div key={l} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:3,color:on?'var(--track-green)':'var(--text-secondary)',font:(on?'700':'500')+' 11px var(--font-sans)'}}><Icon name={i} size={22}/>{l}</div>)}
    </div>
  </div>;
}
function App(){
  const [a,setA]=React.useState(false);
  return <><Phone><MobileLogin onLogin={()=>setA(true)}/></Phone><Phone><MobileHome onOpen={()=>{}}/></Phone></>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
